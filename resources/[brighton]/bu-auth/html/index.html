<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Brighton Union</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Чёрная подложка: страница живёт с момента запуска ресурса и до входа
         в игру закрывает мир — между лоадером и формой ничего не мелькает -->
    <div class="blackout"></div>
    <div class="bg-image"></div>
    <div class="bg-vignette"></div>

    <div class="panel" id="panel">
        <div class="tabs">
            <button class="tab active" id="tab-login">Вход</button>
            <button class="tab" id="tab-register">Регистрация</button>
        </div>

        <div class="form">
            <label class="field">
                <span class="field-label">Логин</span>
                <input type="text" id="username" maxlength="16" placeholder="Ваш логин" autocomplete="off" />
            </label>
            <label class="field">
                <span class="field-label">Пароль</span>
                <input type="password" id="password" maxlength="32" placeholder="••••••••" />
            </label>
            <div class="error" id="error"></div>
            <button class="submit" id="submit" type="button">Войти</button>
        </div>

        <div class="foot">made by <span>catelizn</span></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
