<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Аренда транспорта</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="overlay" class="overlay">
        <div class="panel">
            <div class="panel-header">
                <div class="header-title">Аренда транспорта</div>
                <button class="close-button" id="close-button">&times;</button>
            </div>
            <div class="notice" id="notice">Выбери транспорт. Машины требуют права категории B.</div>
            <div class="duration-row">
                <span class="duration-label">Срок аренды:</span>
                <select id="hours-select">
                    <option value="1">1 час</option>
                    <option value="2">2 часа</option>
                    <option value="3" selected>3 часа</option>
                </select>
            </div>
            <div class="vehicles" id="vehicles"></div>
            <button class="return-button" id="return-button" style="display:none;">Вернуть транспорт</button>
            <div class="panel-footer">
                <div class="footer-hint">Оплата спишется после подтверждения</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
