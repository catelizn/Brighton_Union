<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Путь новичка</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="overlay" class="overlay">
        <div class="panel">
            <div class="panel-header">
                <div class="npc-avatar" id="npc-avatar">MF</div>
                <div class="panel-title">
                    <div class="npc-name" id="npc-name">Mike Ford</div>
                    <div class="quest-label" id="quest-label">Путь новичка</div>
                </div>
                <button class="close-button" id="close-button">&times;</button>
            </div>
            <div class="quest-progress">
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0 / 7</div>
            </div>
            <div class="panel-body">
                <div class="dialog-text" id="dialog-text">—</div>
                <div class="task-reward hidden" id="task-reward"></div>
            </div>
            <div class="panel-footer">
                <button class="advance-button hidden" id="advance-button">Получить награду</button>
                <button class="ok-button hidden" id="ok-button">Хорошо</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
