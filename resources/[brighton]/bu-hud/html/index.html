<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="hud" class="hud">
        <div class="status-panel">
            <div class="status-bar">
                <div class="bar-fill health" id="bar-health"></div>
            </div>
            <div class="status-bar">
                <div class="bar-fill armor" id="bar-armor"></div>
            </div>
            <div class="status-bar">
                <div class="bar-fill hunger" id="bar-hunger"></div>
            </div>
            <div class="status-bar">
                <div class="bar-fill thirst" id="bar-thirst"></div>
            </div>
            <div class="status-bar">
                <div class="bar-fill stress" id="bar-stress"></div>
            </div>
        </div>

        <div class="money-panel">
            <div class="money-line"><span class="money-label">Наличные</span><span class="money-value" id="money-cash">$0</span></div>
            <div class="money-line"><span class="money-label">Банк</span><span class="money-value" id="money-bank">$0</span></div>
            <div class="money-line location"><span id="location">—</span></div>
            <div class="money-line"><span id="clock">00:00</span></div>
        </div>

        <div class="made-by">Made by catelizn</div>

        <div class="side-panel">
            <div class="side-header">
                <span class="logo">BU</span>
                <span class="server-name">Brighton Union</span>
            </div>
            <div class="online">Онлайн: <span id="online">0</span></div>
            <div class="quest" id="quest">Путь новичка: —</div>
            <div class="hotkeys">
                <div class="hotkey"><span class="key">↑</span> Телефон</div>
                <div class="hotkey"><span class="key">↓</span> Планшет</div>
                <div class="hotkey"><span class="key">I</span> Инвентарь</div>
                <div class="hotkey"><span class="key">F2</span> Меню</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
