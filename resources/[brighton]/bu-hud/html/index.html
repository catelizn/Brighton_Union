<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="hud" class="hud">
        <div class="vitals">
            <div class="armor-wrap" id="armor-wrap">
                <div class="ring" id="ring-health"><span class="ring-text" id="text-health">100%</span></div>
            </div>
            <div class="ring ring-small" id="ring-stamina">
                <span class="ring-icon">⚡</span>
                <span class="ring-text" id="text-stamina">100%</span>
            </div>
            <div class="ring ring-small" id="ring-hunger">
                <span class="ring-icon">🍔</span>
                <span class="ring-text" id="text-hunger">100%</span>
            </div>
            <div class="ring ring-small" id="ring-thirst">
                <span class="ring-icon">🥤</span>
                <span class="ring-text" id="text-thirst">100%</span>
            </div>
        </div>

        <div class="side-panel">
            <div class="quest-panel hidden" id="quest-panel">
                <div class="quest-head">
                    <span class="quest-dot"></span>
                    <span>Путь новичка</span>
                    <span class="quest-step" id="quest-step">0/7</span>
                </div>
                <div class="quest-row">
                    <span class="quest-check" id="quest-check"></span>
                    <span class="quest-hint" id="quest-hint">—</span>
                </div>
            </div>
            <div class="hints" id="hints">
                <div class="hint"><b>↑</b> Телефон</div>
                <div class="hint"><b>↓</b> Планшет</div>
                <div class="hint"><b>I</b> Инвентарь</div>
                <div class="hint"><b>L</b> Замок машины</div>
                <div class="hint"><b>G</b> Двигатель</div>
                <div class="hint"><b>F6</b> Скрыть подсказки</div>
            </div>
        </div>

        <div class="made-by">made by catelizn</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
