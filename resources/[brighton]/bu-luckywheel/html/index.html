<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Колесо удачи</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="overlay" class="overlay">
        <div class="wheel-box">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
            <div class="wheel-center">
                <div class="center-label" id="center-label">КРУТИ</div>
            </div>
            <button class="spin-btn" id="spin-btn">Вращать</button>
            <button class="close-btn" id="close-btn">Закрыть</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
