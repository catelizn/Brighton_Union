## FiveM Documentation
## https://aka.cfx.re/server-commands

## QBCore Documentation
## https://docs.qbcore.org

## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "default, deployer, qbcore, qb-core"

## You MAY edit the following:
# sv_licenseKey "YOUR_SERVER_KEY" # get a free key at https://portal.cfx.re/servers/registration-keys
sv_hostname "Brighton Union"
sets sv_projectName "[QBCore Framework] Brighton Union"
sets sv_projectDesc "An advanced FiveM RP framework including jobs, gangs, housing & more!"
sets locale "ru-RU" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
# Клиент b3258 (Bottom Dollar Bounties)
sv_enforceGameBuild 3258
set resources_useSystemChat true
set mysql_connection_string "mysql://root@localhost/QBCore_8A0510?charset=utf8mb4"

# Voice config
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# QBCore locale config
setr qb_locale "ru"

# QBCore UseTarget
setr UseTarget true

# Убираем встроенный спиннер/текст «Loading game» в углу загрузочного экрана
setr sv_showBusySpinnerOnLoadingScreen false

