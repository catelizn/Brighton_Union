## FiveM Documentation
## https://aka.cfx.re/server-commands

## QBCore Documentation
## https://docs.qbcore.org

## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "default, qbcore, qb-core, brighton-union"

## You MAY edit the following:
# sv_licenseKey "YOUR_SERVER_KEY" # get a free key at https://portal.cfx.re/servers/registration-keys
sv_hostname "Brighton Union"
sets sv_projectName "Brighton Union"
sets sv_projectDesc "Open-source roleplay server on QBCore"
sets locale "ru-RU"
load_server_icon myLogo.png
sv_enforceGameBuild 3095 #DLC The Chop Shop
set resources_useSystemChat true
set mysql_connection_string "mysql://root@localhost/QBCore_8A0510?charset=utf8mb4"

# Voice config
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# QBCore locale config
setr qb_locale "ru"

# QBCore UseTarget
setr UseTarget false

# These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# QBCore & Extra stuff
ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]

# Brighton Union
ensure bu-locale
ensure bu-tutorial
ensure bu-rental
ensure bu-tablet
ensure bu-drivingschool
ensure bu-jobs
ensure bu-safezones
ensure bu-families
ensure bu-documents
ensure bu-properties
ensure bu-apartments
ensure bu-auction
ensure bu-casino
ensure bu-hud
ensure bu-news

## Permissions ##
add_ace group.admin command allow # allow all commands
# add_principal identifier.fivem:YOUR_FIVEM_ID group.admin # your admin identifier

# Resources
add_ace resource.qb-core command allow # Allow qb-core to execute commands

# Gods
add_ace qbcore.god command allow # Allow all commands

# Inheritance
add_principal qbcore.god group.admin # Allow gods access to the main admin group used to get all default permissions
add_principal qbcore.god qbcore.admin # Allow gods access to admin commands
add_principal qbcore.admin qbcore.mod # Allow admins access to mod commands
